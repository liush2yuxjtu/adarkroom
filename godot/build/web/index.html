<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小黑屋 — A Dark Room 重制</title>
  <meta name="description" content="A Dark Room 简体中文 Godot/Web 重制。原作 Michael Townsend / doublespeak games，MPL-2.0。" />
  <link rel="stylesheet" href="adr.css" />
</head>
<body>
  <div id="app">
    <div id="wrapper">
      <div id="notifications"></div>
      <div id="header"></div>
      <div id="panel-room" class="panel active"></div>
      <div id="panel-outside" class="panel"></div>
      <div id="panel-path" class="panel"></div>
      <div id="stores" style="display:none"></div>
    </div>
    <div id="menu">
      <button type="button" id="btn-hyper">加速.</button>
      <button type="button" id="btn-settings">设置.</button>
      <button type="button" id="btn-export">导出遥测.</button>
      <button type="button" id="btn-restart">重开.</button>
      <button type="button" id="btn-classic">原版.</button>
      <span id="director-label">导演：规则</span>
    </div>
  </div>
  <div id="overlay"></div>
  <div id="toast"></div>
  <script src="engine.js"></script>
  <script src="ui.js"></script>
</body>
</html>
