<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>小黑屋 — A Dark Room 重制</title>
  <meta name="description" content="A Dark Room 简体中文 Godot/Web 重制。原作 Michael Townsend / doublespeak games，MPL-2.0。" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@5.2.5/latin-400-normal.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="fonts/NotoSansSC-Regular-subset.woff2" crossorigin />
  <link rel="stylesheet" href="adr.css" />
  <link rel="stylesheet" href="assets/pixel/pixel-icons.css" />
</head>
<body class="style-text">
  <div id="app">
    <div id="wrapper">
      <div id="notifications"></div>
      <div id="header"></div>
      <div id="panel-room" class="panel active"></div>
      <div id="panel-outside" class="panel"></div>
      <div id="panel-path" class="panel"></div>
      <div id="stores" style="display:none"></div>
    </div>
    <div id="menu">
      <button type="button" id="btn-style" data-icon="spark" aria-pressed="false" title="切换到像素风格">像素.</button>
      <button type="button" id="btn-hyper" data-icon="fast">加速.</button>
      <button type="button" id="btn-settings" data-icon="settings">设置.</button>
      <button type="button" id="btn-export" data-icon="export">导出遥测.</button>
      <button type="button" id="btn-restart" data-icon="restart">重开.</button>
      <button type="button" id="btn-classic" data-icon="classic">原版.</button>
      <span id="director-label">导演：规则</span>
    </div>
  </div>
  <div id="overlay"></div>
  <div id="toast"></div>
  <div id="phase-wipe" hidden></div>
  <script src="telemetry-config.js"></script>
  <script src="sinks/supabase.js"></script>
  <script src="telemetry.js"></script>
  <script src="save-telemetry.js"></script>
  <script src="engine.js"></script>
  <script src="ui.js"></script>
</body>
</html>
